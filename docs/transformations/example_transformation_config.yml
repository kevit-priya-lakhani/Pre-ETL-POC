# Transformation stage configuration
# Applied after ingestion; operations are executed column-by-column in the order listed.
# All expressions map to DuckDB SQL unless noted otherwise.
source: example_ingestion_config.yml   # (optional) reference to the ingestion config; used for validation and to resolve source_name mappings in the schema

columns:
  # ──────────────────────────────────────────────────────────────
  # director_name  (string)
  # ──────────────────────────────────────────────────────────────
  - name: director_name
    transformations:
      # Trimming — strips leading/trailing whitespace
      # DuckDB: TRIM(director_name)
      - type: trim
        side: both                          # both | left | right

      # Non-printable character removal — replaces control characters with ""
      # DuckDB: regexp_replace(col, '[^\x20-\x7E]', '', 'g')
      - type: remove_non_printable

      # Type casting — explicit cast to the target SQL type
      # DuckDB: TRY_CAST(col AS VARCHAR)
      - type: cast
        to: string

  # ──────────────────────────────────────────────────────────────
  # film_count  (integer)
  # ──────────────────────────────────────────────────────────────
  - name: film_count
    transformations:
      - type: cast
        to: integer                         # string | integer | float | boolean | date | datetime

      # Rounding — rounds a numeric value to N decimal places
      # DuckDB: ROUND(col, 0)  (for integers, 0 decimals)
      - type: round
        decimal_places: 0

  # ──────────────────────────────────────────────────────────────
  # gross_revenue  (float)
  # ──────────────────────────────────────────────────────────────
  - name: gross_revenue
    transformations:
      - type: cast
        to: float

      - type: round
        decimal_places: 2

  # ──────────────────────────────────────────────────────────────
  # debut_date  (date)
  # ──────────────────────────────────────────────────────────────
  - name: debut_date
    transformations:
      # Date conversion — parses one or more source formats and outputs a canonical format
      # DuckDB: TRY_CAST(strptime(col, source_formats[0]) AS DATE)
      #         Falls through source_formats list until one succeeds.
      - type: date_conversion
        source_formats:                     # try each format in order; first non-null result wins
          - "%d/%m/%Y"
          - "%m-%d-%Y"
          - "%Y%m%d"
        target_format: "%Y-%m-%d"           # ISO 8601 output format

  # ──────────────────────────────────────────────────────────────
  # bio  (string)  — substring extraction examples
  # ──────────────────────────────────────────────────────────────
  - name: bio
    transformations:
      - type: trim
        side: both

      # Substring by position — extracts characters starting at `start` for `length` chars
      # DuckDB: SUBSTRING(col, start, length)
      - type: substring
        mode: position                      # position | pattern
        start: 1                            # 1-based index
        length: 200

      # Substring by pattern — extracts first match of a regex group
      # DuckDB: regexp_extract(col, pattern, 1)
      # - type: substring
      #   mode: pattern
      #   pattern: "^([^.]+)\."             # capture group 1 = text before first period

  # ──────────────────────────────────────────────────────────────
  # genre  (string)  — case conversion + null replace example
  # ──────────────────────────────────────────────────────────────
  - name: genre
    transformations:
      # Upper/lower case conversion
      # DuckDB: UPPER(col) | LOWER(col)
      - type: case_conversion
        to: upper                           # upper | lower

      # Null value handling — replace nulls with a default value
      # DuckDB: COALESCE(col, 'UNKNOWN')
      - type: null_handling
        strategy: replace                   # replace | drop_row
        replace_with: "UNKNOWN"             # used when strategy is replace; must match column type
                                            # omit when strategy is drop_row

  # ──────────────────────────────────────────────────────────────
  # notes  (string)  — null drop_row example
  # ──────────────────────────────────────────────────────────────
  - name: notes
    transformations:
      # Null value handling — drop rows where this column is null
      # Applied as a post-read filter: WHERE notes IS NOT NULL
      - type: null_handling
        strategy: drop_row

  # ──────────────────────────────────────────────────────────────
  # phone_number  (string)  — regex_replace example (normalization)
  # ──────────────────────────────────────────────────────────────
  - name: phone_number
    transformations:
      - type: trim
        side: both

      # Regex replace — general-purpose find/replace using a regular expression
      # Strips all non-digit characters: (123) 456-7890 → 1234567890
      # DuckDB: regexp_replace(col, '[^0-9]', '', 'g')
      - type: regex_replace
        pattern: '[^0-9]'                   # regex pattern to match
        replacement: ''                     # string to substitute for each match
        flags: 'g'                          # optional; default 'g' (global). DuckDB regex flags:
                                            #   g = global (all matches), i = case-insensitive,
                                            #   s = dotall (. matches \n), m = multiline

      # Another regex_replace — prefix with country code if not already present
      # Adds '00' prefix only when the number does not already start with '00'
      # DuckDB: regexp_replace(col, '^(?!00)', '00')
      # - type: regex_replace
      #   pattern: '^(?!00)'
      #   replacement: '00'

  # ──────────────────────────────────────────────────────────────
  # email  (string)  — regex_validate example
  # ──────────────────────────────────────────────────────────────
  - name: email
    transformations:
      - type: trim
        side: both

      - type: case_conversion
        to: lower

      # Regex validate — tests the value against a regex pattern;
      # values that do NOT match are either nullified or cause the row to be dropped.
      # DuckDB (nullify):   CASE WHEN regexp_matches(col, pattern) THEN col ELSE NULL END
      # DuckDB (drop_row):  WHERE regexp_matches(col, pattern)
      - type: regex_validate
        pattern: '^[a-z0-9._%+\-]+@[a-z0-9.\-]+\.[a-z]{2,}$'   # regex the value must match
        on_mismatch: nullify                # nullify | drop_row
                                            #   nullify  — set non-matching values to NULL
                                            #             (can be paired with a downstream null_handling)
                                            #   drop_row — discard the entire row if it doesn't match

  # ──────────────────────────────────────────────────────────────
  # account_code  (string)  — regex_validate with drop_row
  # ──────────────────────────────────────────────────────────────
  - name: account_code
    transformations:
      - type: trim
        side: both

      # Drop rows where account_code doesn't match the expected format
      - type: regex_validate
        pattern: '^[A-Z]{2,4}\d{6,12}$'     # e.g., ACC001234, LN00012345
        on_mismatch: drop_row


# ──────────────────────────────────────────────────────────────
# new_columns — derived / computed columns added to the output
# ──────────────────────────────────────────────────────────────
new_columns:

  # Fixed value — constant for every row
  # DuckDB: SELECT 'DIRECTORS' AS source_system
  - name: source_system
    type: string
    value: fixed                            # fixed | expression | conditional | concat | arithmetic | uuid
    fixed_value: "DIRECTORS"

  # Expression — raw DuckDB SQL referencing existing columns
  # DuckDB: SELECT <expression> AS col_name
  - name: revenue_per_film
    type: float
    value: expression
    expression: "ROUND(gross_revenue / NULLIF(film_count, 0), 2)"

  # Concatenation — joins multiple columns (or literals) with a separator
  # DuckDB: concat_ws(separator, part1, part2, ...)
  - name: display_label
    type: string
    value: concat
    separator: " — "
    parts:
      - column: director_name
      - column: debut_date
      - literal: "(director)"

  # Arithmetic — combines columns and literals with standard operators
  # DuckDB: (col_a + col_b) * literal  etc.
  - name: adjusted_revenue
    type: float
    value: arithmetic
    expression: "gross_revenue * 1.05"      # shorthand; same as value: expression for simple math

  # Conditional (if-else) — produces a value based on a DuckDB CASE WHEN expression
  # DuckDB: CASE WHEN <when> THEN <then> [WHEN ...] ELSE <else> END
  - name: tier
    type: string
    value: conditional
    cases:
      - when: "film_count >= 20"
        then: "Prolific"
      - when: "film_count >= 10"
        then: "Active"
      - when: "film_count >= 1"
        then: "Emerging"
    else: "Unknown"

  # Auto-generated UUID key — unique per row
  # DuckDB: gen_random_uuid()
  - name: record_id
    type: string
    value: uuid

  # Sequential integer series — row number starting at 1
  # DuckDB: ROW_NUMBER() OVER ()
  - name: row_num
    type: integer
    value: series
    # start: 1     # optional; first value (default: 1)
    # step: 1      # optional; increment per row (default: 1)

  # Load timestamp — current timestamp at pipeline execution time
  # DuckDB: NOW()
  - name: ingested_at
    type: datetime
    value: expression
    expression: "NOW()"

  # Date function — extract a date component or perform date arithmetic
  # ---- Component extraction ----
  # DuckDB: YEAR(debut_date)
  - name: debut_year
    type: integer
    value: date_function
    function: year                          # year | month | day
    source_column: debut_date

  # DuckDB: MONTH(debut_date)
  - name: debut_month
    type: integer
    value: date_function
    function: month
    source_column: debut_date