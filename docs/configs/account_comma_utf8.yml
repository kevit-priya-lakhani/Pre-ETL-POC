
file:
  remote_directory: /sftp/incoming/
  name_pattern: "Account_{timestamp}_comma_utf8.csv"
  timestamp_pattern: "%Y%m%d %H%M%S"   
  name_pattern_selection: latest

format:
  type: delimited
  delimiter: ","
  enclosing_character: '"'              
  encoding: UTF-8
  line_ending: "\n"
  has_header: true
  skip_rows: 0
  comment_prefix: "#"                  

min_record_threshold: 1


schema:
  - name: RecordId
    type: integer
    not_null: true

  - name: AccountNumber
    type: string
    not_null: true
    max_length: 20

  - name: ProductCode
    type: string
    allowed_values:
      - CC
      - ML
      - UL
      - VL

  - name: OpenDate
    type: date
    # Multiple date formats present in test data (20170315, 2016-11-01, 05/01/2020).
    # Rows with non-conforming formats will be treated as bad records.
    date_format: "%Y%m%d"

bad_records:
  handling: move
  threshold: 10
  threshold_type: percentage
