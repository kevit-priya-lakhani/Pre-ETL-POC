file:
  remote_directory: /sftp/incoming/
  name_pattern: "Account_{timestamp}_pipe_quote_enclosed_values.txt"
  timestamp_pattern: "%Y%m%d %H%M%S"
  name_pattern_selection: latest

format:
  type: delimited
  delimiter: "|"
  enclosing_character: '"'            
  encoding: UTF-8
  line_ending: "\n"
  has_header: false                    
  skip_rows: 0

min_record_threshold: 1
schema:
  - name: RecordId
    type: integer
    not_null: true

  - name: AccountNumber
    type: string
    not_null: true
    max_length: 20

  - name: ProductCode
    type: string
    allowed_values:
      - CC
      - ML
      - UL
      - VL

  # COL004–COL007 (cols 4–7) — unnamed placeholder columns, 
  - name: col_4
    type: string
  - name: col_5
    type: string
  - name: col_6
    type: string
  - name: col_7
    type: string

  - name: OpenDate
    type: date
    date_format: "%Y%m%d"

  # COL009–COL015 (cols 9–15) — unnamed placeholder columns, -skipped for brevity, but would be defined similarly to cols 4–7

  - name: Currency
    type: string
    allowed_values:
      - EUR
      - USD

  # COL017 (col 17) — 

  - name: DaysPastDue
    type: integer
    min: 0

  # COL019–COL020 (cols 19–20) — 

  - name: ArrearsDays
    type: integer
    min: 0

  # COL022 (col 22) — 

  - name: OriginalAmount
    type: integer
    min: 0

  # COL024 (col 24) — 

  - name: InstalmentAmount
    type: integer
    min: 0

  # COL026–COL028 (cols 26–28) — 

  - name: OutstandingBalance
    type: integer
    min: 0

  - name: PrincipalBalance
    type: integer
    min: 0

  # COL031 (col 31) — 

  - name: AccountStatus
    type: string
    not_null: true
    allowed_values:
      - A
      - W
      - C

  - name: AccountSubStatus
    type: string

  # COL034–COL036 (cols 34–36) — 

  - name: MonthlyPayment
    type: integer
    min: 0

  # COL038–COL207 (cols 38–207) — 

bad_records:
  handling: move
  threshold: 10
  threshold_type: percentage
