file:
  remote_directory: /sftp/incoming/
  name_pattern: "Account_{timestamp}_semicolon_utf16.txt"
  timestamp_pattern: "%Y%m%d %H%M%S"
  name_pattern_selection: latest

format:
  type: delimited
  delimiter: ";"
  enclosing_character: '"'
  encoding: UTF-16                    
  line_ending: "\r\n"                  
  has_header: true
  skip_rows: 0
  comment_prefix: "#"

min_record_threshold: 1

schema:
  - name: RecordId
    type: integer
    not_null: true

  - name: AccountNumber
    type: string
    not_null: true
    max_length: 20

  - name: ProductCode
    type: string
    allowed_values:
      - CC
      - ML
      - UL
      - VL

  - name: OpenDate
    type: date
    date_format: "%Y%m%d"

bad_records:
  handling: move
  threshold: 10
  threshold_type: percentage
