file:
  remote_directory: /sftp/incoming/
  name_pattern: "Account_{timestamp}_mixed_record_types.txt"
  timestamp_pattern: "%Y%m%d %H%M%S"
  name_pattern_selection: latest

format:
  type: delimited
  delimiter: "|"
  encoding: UTF-8
  line_ending: "\n"
  has_header: true
  skip_rows: 0
  comment_prefix: "#"

min_record_threshold: 1
filter_condition: "record_type = 'PAY'"
schema:
  - name: record_type
    type: string
    allowed_values:
      - ACC
      - PAY
      - TRL

  - name: record_id
    type: string              
    not_null: true

  - name: payload_or_fields
    type: string             
    not_null: true

 
bad_records:
  handling: move
  threshold: 10
  threshold_type: percentage
