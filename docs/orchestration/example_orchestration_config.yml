# ============================================================================
# JOB ORCHESTRATION CONFIG — EXAMPLE
# ============================================================================
# Top-level config that ties all pipeline stages together and schedules the
# Airflow DAG. Stage configs are referenced by file path.
# Credentials are never stored here — they live in Airflow connections.
# ============================================================================


# ---------------------------------------------------------------------------
# JOB IDENTITY
# ---------------------------------------------------------------------------
job_id: "accounts_daily_load"
description: "Daily ingestion, transformation, aggregation, and load of account and payment data"


# ---------------------------------------------------------------------------
# SCHEDULE
# Airflow DAG scheduling and retry parameters.
# ---------------------------------------------------------------------------
schedule:
  cron: "0 6 * * *"           # cron expression — this example runs daily at 06:00 optional
 
  retries: 3                   # number of retry attempts per task on failure
  retry_delay: 300             # seconds to wait between retries
  timeout: 7200                # seconds a single task run may take before it is killed


# ---------------------------------------------------------------------------
# FILE WAIT
# Job-level settings applied uniformly to every file in the ingestion stage.
# ---------------------------------------------------------------------------
file_wait:
  timeout: 3600                # seconds to wait for a file to appear on the source before giving up
  poke_interval: 60            # polling interval in seconds while waiting
  on_missing: fail             # behaviour when a file does not arrive within timeout
                               #   fail     — raise an exception and abort the job
                               #   continue — log a warning, skip that ingestion step, and proceed


# ---------------------------------------------------------------------------
# CONNECTIONS
# All values are Airflow connection IDs. No credentials are stored here.
# ---------------------------------------------------------------------------
connections:
  source: "sftp_default"            # SFTP connection used by all ingestion tasks
  destination: "postgres_default"   # DB connection used by the loading stage and post-loading SQL
  blob_storage: "azure_blob_conn"   # (optional) override the default blob storage connection ID.
                                    # Parquet files produced between pipeline stages are always written
                                    # to blob storage. If omitted, the default blob storage connection
                                    # configured at the environment level is used.


# ---------------------------------------------------------------------------
# STAGES
# Executed in order: ingestion → transformation → aggregation → loading.
# Omit any stage block that is not needed for this job.
# ---------------------------------------------------------------------------
stages:

  # ── Ingestion ─────────────────────────────────────────────────────────────
  # One entry per source file. Each config path points to an ingestion YAML.
  # The file_id declared inside each referenced config is used by later stages
  # to reference that file's output Parquet.
  ingestion:
    - config: "docs/configs/account_comma_utf8.yml"
      # on_missing: fail             # (optional) override job-level file_wait.on_missing for this file only
                                     #   fail     — raise an exception and abort the job
                                     #   continue — log a warning, skip this file, and proceed
    - config: "docs/configs/payment_delta.yml"
      on_missing: continue           # this file is optional — skip if not present

  # ── Transformation ────────────────────────────────────────────────────────
  # List of transformation configs. All tasks run in parallel.
  # Each config declares which ingestion file_id it operates on.
  transformation:
    - config: "docs/transformations/example_transformation_config.yml"

  # ── Aggregation ───────────────────────────────────────────────────────────
  # List of aggregation configs. Each task starts as soon as its declared
  # upstream transformation config completes — not waiting for all transformations.
  # Loading begins only after ALL aggregation tasks have completed.
  aggregation:
    - config: "docs/aggregations/example_aggregation_config.yml"
      depends_on: "docs/transformations/example_transformation_config.yml"  # upstream transformation

  # ── Loading ───────────────────────────────────────────────────────────────
  # Ordered list of loading configs. Tasks are executed sequentially in the
  # order listed — each entry completes before the next begins.
  loading:
    - config: "docs/loading/example_loading_config.yml"


# ---------------------------------------------------------------------------
# POST-LOADING SQL
# Executed against the destination DB after all loading tasks complete.
# Statements within each block are executed in the order listed, in a single
# transaction. connection_id defaults to connections.destination when omitted.
# ---------------------------------------------------------------------------
post_loading_sql:
  - statements:
      - "UPDATE staging.accounts SET loaded_flag = TRUE WHERE loaded_flag IS NULL"
      - >-
        INSERT INTO audit.load_log (job_id, loaded_at)
        VALUES ('accounts_daily_load', CURRENT_TIMESTAMP)


