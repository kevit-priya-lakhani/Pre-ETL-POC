default:
  default_args:
    owner: airflow
    retries: 1
    

simple_file_transfer:
  description: Transfer a CSV from SFTP and read it with a downstream task.
  catchup: false
  render_template_as_native_obj: true
  start_date:
    __type__: datetime.datetime
    year: 2025
    month: 1
    day: 1
  schedule: null
  tags:
    - sftp
    - dagfactory
  tasks:
    - task_id: create_sftp_connection
      operator: airflow.providers.standard.operators.python.PythonOperator
      python_callable_name: upsert_sftp_connection
      python_callable_file: /opt/airflow/include/tasks/file_ingestion.py
      op_kwargs:
        conn_id: sftp_default
        host: sftp
        port: 22
        username: sftp
        password: password
        extra:
          no_host_key_check: "true"
    - task_id: validate_sftp_connection
      operator: airflow.providers.standard.operators.python.PythonOperator
      python_callable_name: validate_sftp_connection
      python_callable_file: /opt/airflow/include/tasks/file_ingestion.py
      op_kwargs:
        conn_id: sftp_default
        remote_path: /upload/top_directors_data.csv
      dependencies:
        - create_sftp_connection
    - task_id: ingest_remote_file
      operator: airflow.providers.standard.operators.python.PythonOperator
      python_callable_name: ingest_sftp_file
      python_callable_file: /opt/airflow/include/tasks/file_ingestion.py
      op_kwargs:
        conn_id: sftp_default
        remote_path: /upload/top_directors_data.csv
        local_directory: /tmp/pre_etl
      dependencies:
        - validate_sftp_connection
    - task_id: read_ingested_file
      operator: airflow.providers.standard.operators.python.PythonOperator
      python_callable_name: read_csv_file
      python_callable_file: /opt/airflow/include/tasks/file_ingestion.py
      op_kwargs:
        local_path: "{{ ti.xcom_pull(task_ids='ingest_remote_file') }}"
        preview_rows: 5
      dependencies:
        - ingest_remote_file