# ============================================================
# Docker Compose — Airflow + SFTP + Oracle XE
# ============================================================
# Prerequisites:
#   1. Generate a Fernet key and set AIRFLOW__CORE__FERNET_KEY:
#        python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
#   2. Run `docker compose up airflow-init` once before first start.
#   3. Then run `docker compose up -d` to start all services.
# ============================================================

x-airflow-common:
  &airflow-common
  build: .
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
    AIRFLOW__CORE__FERNET_KEY: ''              # <-- fill in a generated Fernet key
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session'
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: 'admin:admin'
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: 'true'
    AIRFLOW__WORKERS__BASE_URL: 'http://airflow-webserver:8080'
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: 'http://airflow-webserver:8080/execution/'
    AIRFLOW__WEBSERVER__SECRET_KEY: '69ec771e212b96df758b6a7f069d9b935ae00ec89aea5108ef89be8b972a1371'
    _PIP_ADDITIONAL_REQUIREMENTS: ''
  volumes:
    - ./dags:/opt/airflow/dags
    - ./include:/opt/airflow/include
    - airflow_logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
  depends_on:
    postgres:
      condition: service_healthy

# ============================================================
services:

  # ----------------------------------------------------------
  # Metadata database for Airflow
  # ----------------------------------------------------------
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  # ----------------------------------------------------------
  # Airflow — one-time initialisation (run this first)
  # Creates DB schema + admin user (admin / admin)
  # ----------------------------------------------------------
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        echo "Airflow initialised."
    environment:
      <<: *airflow-common-env
    restart: "no"

  # ----------------------------------------------------------
  # Airflow Webserver  →  http://localhost:8080
  # ----------------------------------------------------------
  airflow-webserver:
    <<: *airflow-common
    command: ["airflow", "api-server"]
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always

  # ----------------------------------------------------------
  # Airflow Scheduler
  # ----------------------------------------------------------
  airflow-scheduler:
    <<: *airflow-common
    hostname: airflow-scheduler
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always

  # ----------------------------------------------------------
  # Airflow DAG Processor (required in Airflow 3.0 to parse DAG files)
  # ----------------------------------------------------------
  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always

  # ----------------------------------------------------------
  # SFTP Server  →  sftp://localhost:2222
  # Credentials: sftp / password
  # Upload directory: /home/sftp/upload
  # Connect: sftp -P 2222 sftp@localhost
  # ----------------------------------------------------------
  sftp:
    image: atmoz/sftp
    ports:
      - "2222:22"
    command: sftp:password:1000:100:upload
    volumes:
      - sftp-data:/home/sftp/upload
    restart: always

  # ----------------------------------------------------------
  # Oracle XE  →  localhost:1521  |  EM Express: https://localhost:5500/em
  # SYSTEM password: password
  # JDBC URL: jdbc:oracle:thin:@localhost:1521/XEPDB1
  # ----------------------------------------------------------
  oracle:
    image: gvenzl/oracle-xe
    ports:
      - "1521:1521"
      - "5500:5500"
    environment:
      ORACLE_PASSWORD: password
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD-SHELL", "echo 'SELECT 1 FROM DUAL;' | sqlplus -s system/password@localhost/XEPDB1 | grep -q 1"]
      interval: 30s
      timeout: 20s
      retries: 10
      start_period: 120s
    restart: always

# ============================================================
volumes:
  postgres-db-volume:
  sftp-data:
  oracle-data:
  airflow_logs:

